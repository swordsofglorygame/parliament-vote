<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برلمان سيوف المجد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo">⚔️</div>

            <h1>برلمان سيوف المجد</h1>

            <p class="subtitle">
                أدخل بيانات حسابك للتحقق من أهليتك والمشاركة في انتخابات البرلمان.
            </p>

            <form id="verificationForm">

                <div class="form-group">
                 <label for="rid">رقم الهوية بالمملكة (RID)</label>

<input
    type="text"
    id="rid"
    name="rid"
    placeholder="أدخل رقم الهوية بالمملكة"
    inputmode="numeric"
    autocomplete="off"
    required
>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني المسجل باللعبة</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="أدخل البريد الإلكتروني"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit">
                    متابعة
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="footer">
                سيوف المجد — اللاعبون جزء من الإدارة
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
