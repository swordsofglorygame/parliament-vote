<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة برلمان سيوف المجد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <!-- Login -->
    <section class="card" id="loginCard">

        <div class="logo">🔐</div>

        <h1>لوحة إدارة البرلمان</h1>

        <p class="subtitle">
            تسجيل الدخول إلى لوحة إدارة انتخابات سيوف المجد.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="adminPassword">
                    كلمة مرور الإدارة
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                تسجيل الدخول
            </button>

        </form>

        <div id="loginMessage" class="message"></div>

    </section>


    <!-- Admin Dashboard -->
    <section
        class="card"
        id="dashboardCard"
        style="display: none;"
    >

        <div class="logo">🏛️</div>

        <h1>لوحة الإدارة</h1>

        <p class="subtitle">
            إنشاء وإدارة انتخابات برلمان سيوف المجد.
        </p>


        <!-- Create Election -->
        <div id="createElectionSection">

            <h2 style="margin-bottom: 20px; color: #d9ad5b;">
                إنشاء انتخابات جديدة
            </h2>

            <form id="createElectionForm">

                <div class="form-group">
                    <label for="serverId">
                        السيرفر
                    </label>

                    <select
                        id="serverId"
                        required
                        style="
                            width: 100%;
                            padding: 14px 16px;
                            border-radius: 10px;
                            border: 1px solid #59462e;
                            background: #100c08;
                            color: #fff;
                            font-size: 16px;
                        "
                    >
                        <option value="">
                            اختر السيرفر
                        </option>

                        <option value="18">
                            Server 18
                        </option>

                        <option value="19">
                            Server 19
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="seats">
                        عدد المقاعد
                    </label>

                    <select
                        id="seats"
                        required
                        style="
                            width: 100%;
                            padding: 14px 16px;
                            border-radius: 10px;
                            border: 1px solid #59462e;
                            background: #100c08;
                            color: #fff;
                            font-size: 16px;
                        "
                    >
                        <option value="3">
                            3 مقاعد
                        </option>

                        <option value="5" selected>
                            5 مقاعد
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="minChoices">
                        أقل عدد مرشحين يمكن اختيارهم
                    </label>

                    <input
                        type="number"
                        id="minChoices"
                        min="1"
                        value="1"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="maxChoices">
                        أقصى عدد مرشحين يمكن اختيارهم
                    </label>

                    <input
                        type="number"
                        id="maxChoices"
                        min="1"
                        value="5"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="startAt">
                        وقت البداية — UTC
                    </label>

                    <input
                        type="datetime-local"
                        id="startAt"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="endAt">
                        وقت النهاية — UTC
                    </label>

                    <input
                        type="datetime-local"
                        id="endAt"
                        required
                    >
                </div>


                <div
                    class="form-group"
                    style="
                        display: flex;
                        align-items: center;
                        gap: 12px;
                    "
                >

                    <input
                        type="checkbox"
                        id="showResults"
                        style="
                            width: 20px;
                            height: 20px;
                        "
                    >

                    <label
                        for="showResults"
                        style="margin: 0; cursor: pointer;"
                    >
                        إظهار النتائج أثناء التصويت
                    </label>

                </div>


                <button
                    type="submit"
                    id="createElectionButton"
                >
                    إنشاء الانتخابات
                </button>

            </form>


            <div
                id="createElectionMessage"
                class="message"
            ></div>

        </div>

    </section>

</main>

<script src="admin.js"></script>

</body>
</html>
