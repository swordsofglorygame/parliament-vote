<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة برلمان سيوف المجد</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <!-- =========================
         LOGIN
    ========================== -->

    <section class="card" id="loginCard">

        <div class="logo">🔐</div>

        <h1>لوحة إدارة البرلمان</h1>

        <p class="subtitle">
            تسجيل الدخول إلى لوحة إدارة انتخابات سيوف المجد.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="adminEmail">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    name="adminEmail"
                    placeholder="أدخل البريد الإلكتروني"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="adminPassword">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    name="adminPassword"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                id="loginButton"
            >
                تسجيل الدخول
            </button>

        </form>

        <div
            id="loginMessage"
            class="message"
        ></div>

        <div class="footer">
            سيوف المجد — لوحة الإدارة
        </div>

    </section>


    <!-- =========================
         ADMIN DASHBOARD
    ========================== -->

    <section
        class="card"
        id="dashboardCard"
        style="display: none;"
    >

        <div class="logo">🏛️</div>

        <h1>لوحة الإدارة</h1>

        <p class="subtitle">
            إدارة انتخابات برلمان سيوف المجد.
        </p>


        <!-- =========================
             ADMIN HEADER
        ========================== -->

        <div
            style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                margin-bottom: 30px;
                padding-bottom: 18px;
                border-bottom: 1px solid rgba(190, 145, 70, 0.25);
            "
        >

            <span
                id="adminEmailDisplay"
                style="
                    color: #cdbb9f;
                    font-size: 13px;
                "
            ></span>

            <button
                type="button"
                id="logoutButton"
                style="
                    width: auto;
                    margin-top: 0;
                    padding: 9px 16px;
                    font-size: 13px;
                "
            >
                تسجيل الخروج
            </button>

        </div>


        <!-- =========================
             CREATE ELECTION
        ========================== -->

        <div id="createElectionSection">

            <h2
                style="
                    margin-bottom: 20px;
                    color: #d9ad5b;
                    font-size: 22px;
                "
            >
                إنشاء انتخابات جديدة
            </h2>

            <form id="createElectionForm">


                <!-- SERVER -->

                <div class="form-group">

                    <label for="serverId">
                        السيرفر
                    </label>

                    <select
                        id="serverId"
                        required
                        style="
                            width: 100%;
                            padding: 14px 16px;
                            border-radius: 10px;
                            border: 1px solid #59462e;
                            background: #100c08;
                            color: #fff;
                            font-size: 16px;
                            outline: none;
                        "
                    >

                        <option value="">
                            اختر السيرفر
                        </option>

                        <option value="18">
                            Server 18
                        </option>

                        <option value="19">
                            Server 19
                        </option>

                    </select>

                </div>


                <!-- SEATS -->

                <div class="form-group">

                    <label for="seats">
                        عدد مقاعد البرلمان
                    </label>

                    <select
                        id="seats"
                        required
                        style="
                            width: 100%;
                            padding: 14px 16px;
                            border-radius: 10px;
                            border: 1px solid #59462e;
                            background: #100c08;
                            color: #fff;
                            font-size: 16px;
                            outline: none;
                        "
                    >

                        <option value="3">
                            3 مقاعد
                        </option>

                        <option value="5" selected>
                            5 مقاعد
                        </option>

                    </select>

                </div>


                <!-- MIN CHOICES -->

                <div class="form-group">

                    <label for="minChoices">
                        أقل عدد من المرشحين يمكن اختيارهم
                    </label>

                    <input
                        type="number"
                        id="minChoices"
                        min="1"
                        value="1"
                        required
                    >

                </div>


                <!-- MAX CHOICES -->

                <div class="form-group">

                    <label for="maxChoices">
                        أقصى عدد من المرشحين يمكن اختيارهم
                    </label>

                    <input
                        type="number"
                        id="maxChoices"
                        min="1"
                        value="5"
                        required
                    >

                </div>


                <!-- START -->

                <div class="form-group">

                    <label for="startAt">
                        بداية التصويت — UTC
                    </label>

                    <input
                        type="datetime-local"
                        id="startAt"
                        required
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 6px;
                            color: #8f806c;
                            font-size: 12px;
                        "
                    >
                        أدخل الوقت بالتوقيت الدولي UTC.
                    </small>

                </div>


                <!-- END -->

                <div class="form-group">

                    <label for="endAt">
                        نهاية التصويت — UTC
                    </label>

                    <input
                        type="datetime-local"
                        id="endAt"
                        required
                    >

                    <small
                        style="
                            display: block;
                            margin-top: 6px;
                            color: #8f806c;
                            font-size: 12px;
                        "
                    >
                        أدخل الوقت بالتوقيت الدولي UTC.
                    </small>

                </div>


                <!-- RESULTS -->

                <div
                    class="form-group"
                    style="
                        display: flex;
                        align-items: center;
                        gap: 12px;
                    "
                >

                    <input
                        type="checkbox"
                        id="showResults"
                        style="
                            width: 20px;
                            height: 20px;
                            cursor: pointer;
                        "
                    >

                    <label
                        for="showResults"
                        style="
                            margin: 0;
                            cursor: pointer;
                        "
                    >
                        إظهار النتائج أثناء التصويت
                    </label>

                </div>


                <!-- CREATE -->

                <button
                    type="submit"
                    id="createElectionButton"
                >
                    إنشاء الانتخابات
                </button>

            </form>


            <div
                id="createElectionMessage"
                class="message"
            ></div>

        </div>

    </section>

</main>

<script src="admin.js"></script>

</body>
</html>
